<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Step 2</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/step2.css">
    <script src="https://www.w3schools.com/lib/w3.js"></script>
    <script src="js/main.js"></script>
</head>

<body>

    <div w3-include-html="header.html"></div>

    <div class="page-wrapper">
        <!-- Progress Steps -->
        <div class="steps-wrapper">
            <!-- Step 1: Inactive (Completed) -->
            <div class="step-item inactive">
                <div class="step-icon">
                    <img src="image/Location.png" class="step-icon-img" alt="1">
                </div>
                <div class="step-info">
                    <span class="step-label">Step 1</span>
                    <span class="step-title">Address</span>
                </div>
            </div>

            <div class="step-divider"></div>

            <!-- Step 2: Active -->
            <div class="step-item">
                <div class="step-icon">
                    <img src="image/Shipping.png" class="step-icon-img" alt="2">
                </div>
                <div class="step-info">
                    <span class="step-label">Step 2</span>
                    <span class="step-title">Shipping</span>
                </div>
            </div>

            <div class="step-divider"></div>

            <!-- Step 3: Inactive -->
            <div class="step-item inactive">
                <div class="step-icon">
                    <img src="image/payment.png" class="step-icon-img" alt="3">
                </div>
                <div class="step-info">
                    <span class="step-label">Step 3</span>
                    <span class="step-title">Payment</span>
                </div>
            </div>
        </div>

        <!-- Main Shipping Content -->
        <main class="main-content">
            <section class="shipment-section">
                <h2 class="section-title">Shipment Method</h2>

                <div class="shipment-list">
                    <!-- Option 1 -->
                    <div class="shipment-card" data-state="Selected">
                        <div class="card-left">
                            <div class="radio-box">
                                <div class="radio-outer"></div>
                                <div class="radio-inner"></div>
                            </div>
                            <div class="price-text">RM 17</div>
                            <div class="method-text">Regulary shipment</div>
                        </div>
                        <div class="date-text">17 Jan, 2026</div>
                    </div>

                    <!-- Option 2 -->
                    <div class="shipment-card" data-state="Not Selected">
                        <div class="card-left">
                            <div class="radio-box">
                                <div class="radio-outer"></div>
                                <div class="radio-inner"></div>
                            </div>
                            <div class="price-text">RM 30</div>
                            <div class="method-text">Get your delivery as soon as possible</div>
                        </div>
                        <div class="date-text">5 Jan, 2026</div>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <footer class="button-group">
                <button class="btn btn-back">Back</button>
                <button class="btn btn-next">Next</button>
            </footer>
        </main>
    </div>
    <div w3-include-html="footer.html"></div>

    <script>w3.includeHTML();</script>

</body>

</html>
